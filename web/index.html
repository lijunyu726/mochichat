<!doctype html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<script>try{var t=JSON.parse(localStorage.getItem("mochi-theme"))||"auto";document.documentElement.dataset.theme=t==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t}catch(e){}</script>
<title>mochichat 群聊室</title>
<link rel="icon" href="avatars/claude.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="teams">
    <div class="brand"><span class="logo">mochichat</span><button class="pill dark sm" data-act="new-team">＋ 新团队</button></div>
    <div id="team-list"></div>
    <div class="hub-state"><span><span class="dot" id="hub-dot"></span><span id="hub-text">连接中…</span></span><button class="gear" data-act="settings">设置</button></div>
  </aside>

  <main id="chat">
    <header id="head"></header>
    <div id="msgs" aria-live="polite"></div>
    <div id="composer-wrap">
      <div id="popup" hidden></div>
      <div id="composer">
        <label for="input" class="sr">输入消息</label>
        <textarea id="input" rows="1" placeholder="说点什么…　@ 成员　/ 命令"></textarea>
        <div class="composer-row">
          <button class="pill sm" data-act="ins-at">@ 成员</button>
          <button class="pill sm" data-act="ins-all">@all agents</button>
          <button class="pill sm" data-act="ins-slash">/ 命令</button>
          <span class="hint" id="hint">不 @ 就交给主理人</span>
          <button id="send" aria-label="发送" data-act="send"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15V3M4 8l5-5 5 5"/></svg></button>
        </div>
      </div>
    </div>
  </main>

  <aside id="members"></aside>
</div>

<dialog id="dlg-team">
  <form method="dialog">
    <h2>新团队</h2>
    <label>名字<input name="name" required maxlength="40" placeholder="比如：店序后端"></label>
    <label>工作目录<input name="cwd" placeholder="不填就放进默认工作区"></label>
    <label class="check"><input type="checkbox" name="shared">成员共用这个目录，不各开 worktree</label>
    <p class="note">成员会在这个目录里读写文件、执行命令，建好后不能改。目录是 git 仓库时，每个成员默认有自己的 worktree 和分支，互不干扰。</p>
    <div class="dlg-row"><button class="pill" value="cancel" formnovalidate>取消</button><button class="pill dark" value="ok">建好</button></div>
  </form>
</dialog>

<dialog id="dlg-member">
  <form method="dialog">
    <h2>拉人进来</h2>
    <div class="kinds" id="kind-pick"></div>
    <label>名字<input name="name" maxlength="24" placeholder="不填就用类型名"></label>
    <p class="note">同一种 agent 可以加多个，名字要不一样。默认是完全放行，进来后可以在右边改。</p>
    <div class="dlg-row"><button class="pill" value="cancel" formnovalidate>取消</button><button class="pill dark" value="ok">加入</button></div>
  </form>
</dialog>

<dialog id="dlg-settings" class="wide">
  <form method="dialog">
    <h2>设置</h2>
    <h3>新建团队和新成员的默认值</h3>
    <label>默认工作区（新团队不填目录时，放在这里的同名文件夹里）<input name="workspace"></label>
    <div class="two">
      <label>新成员的权限<select name="permission"><option value="full">完全放行</option><option value="readonly">只读</option><option value="ask">每次询问</option></select></label>
      <label>自动讨论上限（轮）<input name="maxRounds" type="number" min="1" max="100"></label>
    </div>
    <label>Claude 的默认模型<select name="m-claude"></select></label>
    <label>codex 的默认模型<select name="m-codex"></select></label>
    <label>agy 的默认模型<select name="m-agy"></select></label>
    <p class="note">这些只影响以后新建的团队和新加的成员，已有的不变。</p>
    <h3>这台浏览器上的界面</h3>
    <div class="two">
      <label>外观<select name="theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>发送消息<select name="sendKey"><option value="enter">回车发送，Shift+回车换行</option><option value="mod">⌘+回车发送，回车换行</option></select></label>
    </div>
    <div class="dlg-row"><button class="pill" value="cancel" formnovalidate>取消</button><button class="pill dark" value="ok">保存</button></div>
  </form>
</dialog>

<dialog id="dlg-brief" class="wide">
  <form method="dialog">
    <h2>团队设置</h2>
    <label>团队名字<input name="name" required maxlength="40"></label>
    <label>团队说明（写给成员的要求，每个成员都会看到）<textarea name="brief" maxlength="4000" placeholder="比如：这个项目用 pnpm；改完代码先跑测试；回答用中文。"></textarea></label>
    <p class="note">改了之后，成员在下一次发言前会看到新的说明。</p>
    <div class="dlg-row"><button class="pill" value="cancel" formnovalidate>取消</button><button class="pill dark" value="ok">保存</button></div>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
